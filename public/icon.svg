<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Central Circular Motif (Rotary Circle of Solidarity & Wealth) -->
  <g filter="url(#dropShadow)" transform="translate(256, 256)">
    <!-- Outer rotary nodes ring -->
    <circle r="160" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="24 16" stroke-linecap="round" />
    
    <!-- Outer glowing node circles representing community members -->
    <circle cx="0" cy="-160" r="18" fill="url(#goldGrad)" />
    <circle cx="138" cy="-80" r="18" fill="url(#goldGrad)" />
    <circle cx="138" cy="80" r="18" fill="url(#goldGrad)" />
    <circle cx="0" cy="160" r="18" fill="url(#goldGrad)" />
    <circle cx="-138" cy="80" r="18" fill="url(#goldGrad)" />
    <circle cx="-138" cy="-80" r="18" fill="url(#goldGrad)" />

    <!-- Inner Protective Shield / Vault Coin -->
    <circle r="115" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="8" />
    <circle r="96" fill="url(#emeraldLight)" fill-opacity="0.15" stroke="#34d399" stroke-width="3" stroke-dasharray="8 6" />

    <!-- Stylized 'T' Vault & African Solidarity Handshake/Treasure Symbol -->
    <!-- Vault / Pillar T -->
    <path d="M -54 -48 L 54 -48 C 58 -48 62 -44 62 -40 L 62 -24 C 62 -20 58 -16 54 -16 L 22 -16 L 22 56 C 22 62 16 68 10 68 L -10 68 C -16 68 -22 62 -22 56 L -22 -16 L -54 -16 C -58 -16 -62 -20 -62 -24 L -62 -40 C -62 -44 -58 -48 -54 -48 Z" fill="url(#goldGrad)" />

    <!-- Sparkle Stars for Wealth & Prosperity -->
    <polygon points="0,-72 6,-60 18,-54 6,-48 0,-36 -6,-48 -18,-54 -6,-60" fill="#fef3c7" />
  </g>
</svg>
